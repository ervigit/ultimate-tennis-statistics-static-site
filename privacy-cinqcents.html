<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Politique de confidentialité | CinqCents</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .page-header {
            padding: 8rem 0 4rem;
            text-align: center;
            background: linear-gradient(to bottom, rgba(26, 147, 254, 0.05), transparent);
        }
        .content-box {
            background: var(--bg-card);
            border: 1px solid var(--border-main);
            border-radius: var(--radius-lg);
            padding: 3rem;
            margin-bottom: 6rem;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .content-box h2 {
            margin-bottom: 2rem;
            color: var(--primary);
        }
        .content-box p {
            margin-bottom: 1.5rem;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <main class="container">
        <section class="page-header">
            <h1 class="text-gradient">CinqCents</h1>
            <p style="margin-top: 1rem; color: var(--text-secondary);">Politique de confidentialité</p>
        </section>

        <section class="content-box">
            <h2>Respect de votre vie privée</h2>
            <p>
                Les développeurs de l'app <strong>CinqCents</strong> ne recueilleront aucune donnée et n'auront accès en aucun cas à vos données personnelles.
            </p>
        </section>
    </main>

</body>
</html>
